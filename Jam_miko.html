<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+SC&family=Noto+Sans+JP&family=Nunito&display=swap");

        body
        {                
            padding: 0 !important;
            margin: 0 !important;
        }
        #main-container
        {
            --text-color: rgb(255, 255, 255);
            --background-color: rgb(0, 0, 0);
            --accent-color: yellow;
            --font-family: "Nunito", "Noto Sans JP", "Noto Sans SC", sans-serif;
            --font-family-label: "Nunito", "Noto Sans JP", "Noto Sans SC", sans-serif;
            --font-weight: 500;
            --font-weight-label: 400;
            --border-radius: 40px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;


            box-sizing: border-box;
            width: fit-content;
            height: fit-content;            
            padding: 2px 16px;
            border-radius: var(--border-radius);
            background-color: var(--background-color);
            color: var(--text-color);
            text-align: center;
            font-family: var(--font-family);
            font-weight: var(--font-weight);

            overflow: hidden;

            /* transform: scale(2);
            transform-origin: top left; */
        }

        #main-container[data-alignvertical="top"]
        {
            border-top-left-radius: 0px;
            border-top-right-radius: 0px;
        }
        #main-container[data-alignvertical="bottom"]
        {
            border-bottom-left-radius: 0px;
            border-bottom-right-radius: 0px;
        }
        #main-container[data-alignhorizontal="left"]
        {
            border-top-left-radius: 0px;
            border-bottom-left-radius: 0px;
        }
        #main-container[data-alignhorizontal="right"]
        {
            border-top-right-radius: 0px;
            border-bottom-right-radius: 0px;
        }

        .accent
        {
            color: var(--accent-color);
        }

        .svg-fill
        {
            fill: var(--text-color);
        }

        #clock
        {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px 24px;
            --clock-size: 64px;
            --border-width: 4px;
            --clock-hour-size: 4px;
            --clock-minute-size: 4px;
            --clock-second-size: 2px;
            --clock-center-size: 4px;
            --overflow: 4px;

            --separator: attr(data-separator,":");
        }

        #clock-icon
        {
            margin-right: 0.5em;
            margin-top: calc(-0.15em + var(--clock-adjust));
        }

        #analog-clock-body
        {
            display: block;
            position: relative;
            box-sizing: border-box;

            width: var(--clock-size);
            height: var(--clock-size);
            
            border: var(--border-width) solid var(--text-color);
            border-radius: 999px;
        }

        .analog-clock-hand
        {
            display: block;
            position: absolute;
            box-sizing: border-box;
            border-radius: 999px;
            width: var(--hand-size);

            bottom: calc(50% - (var(--hand-size, 0) / 2));
            left: calc(50% - (var(--hand-size, 0) / 2));

            transform-origin: calc(var(--hand-size) / 2) calc(100% - var(--hand-size) / 2);
        }

        #analog-clock-hour
        {
            --hand-size: var(--clock-hour-size);
            height: calc(var(--clock-size) * 0.6 / 2);
            background-color: var(--text-color);
        }

        #analog-clock-minute
        {
            --hand-size: var(--clock-minute-size);
            height: calc(var(--clock-size) * 0.8 / 2);
            background-color: var(--text-color);
        }

        #analog-clock-second
        {
            --hand-size: var(--clock-second-size);
            height: calc((var(--clock-size) - var(--border-width)) * 0.9 / 2 + var(--overflow));
            background-color: var(--accent-color);                
             
            bottom: calc(50% - (var(--hand-size, 0) / 2) - var(--overflow));
            transform-origin: calc(var(--hand-size) / 2) calc(100% - var(--hand-size) / 2 - var(--overflow)); 
        }
        #analog-clock-center
        {
            --hand-size: var(--clock-center-size);
            height: var(--clock-center-size);
            background-color: var(--accent-color);  
        }
        

        #clock-text
        {
            display: flex;
            justify-content: center;
            align-items: baseline;
            min-width: 200px;
            font-size: 72px;
            letter-spacing: 0.05em;
            line-height: 1.6;
        }

        #clock-text-separator
        {
            
        }
        
        #clock[data-separator="none"] #clock-text-separator
        {

        }

        #clock[data-separator="beat"] #clock-text-separator
        {                
            animation: separator-beat 1s var(--seconds-delay,0ms) linear infinite;
        }

        #clock[data-separator="breath"] #clock-text-separator
        {                
            animation: separator-breath 2s var(--seconds-delay,0ms) linear infinite;
        }

        #clock[data-separator="tick"] #clock-text-separator
        {
            animation: separator-tick 1s var(--seconds-delay,0ms) step-end infinite;
        }

        #clock-text-ampm
        {
            font-size: 36px;
            margin-left: 0.2em;
        }

        #clock-text-ampm:empty
        {
            display: none;
        }

        #clock[data-hoursystem="24"] #clock-text-ampm
        {
            display: none;
        } 

        @keyframes separator-beat {
            0%, 10%
            {
                opacity: 1;
            }
            100%
            {
                opacity: 0.6;
            }
        }
        @keyframes separator-breath {
            0%, 100%
            {
                opacity: 0.6;
            }
            50%
            {
                opacity: 1;
            }
        }
        @keyframes separator-tick {
            0%, 100%
            {
                opacity: 1;
            }
            50%
            {
                opacity: 0.6;
            }
        }

        #rotator-container
        {
            font-size: 32px;
            --label-height: 48px;
            margin-top: -20px;
            padding-bottom: 52px;
            margin-bottom: -32px;
        }

        #rotator
        {
            display: flex;
            flex-direction: column-reverse;
            height: var(--label-height);
            box-sizing: border-box;
            align-content: center;

            font-family: var(--font-family-label);
            font-weight: var(--font-weight-label);
            --timing: cubic-bezier(.65,0.05,0,0.95);
            --duration: 1600ms;
            --duration-fade: 400ms;
            --duration-none: 0ms;
        }

        #rotator[data-direction="down"]
        {                
            flex-direction: column-reverse;
        }
        #rotator[data-direction="up"]
        {                
            flex-direction: column;
        }

        #rotator[data-direction="fade"]
        {                
            flex-direction: column-reverse;
        }
        #rotator[data-direction="none"]
        {                
            flex-direction: column-reverse;
        }

        .rotator-element
        {
            box-sizing: border-box;
            flex: 0 0 var(--label-height);
            display: flex;
            height: var(--label-height);
            letter-spacing: 0.05em;
            padding: 0.1em 1em;
            
            justify-content: center;
            align-items: center;
        }

        #rotator.animate
        {
            animation-duration: var(--duration);
            animation-timing-function: var(--timing);
            animation-fill-mode: forwards;
        }

        #rotator[data-direction="down"].animate
        {                
            animation-name: label-rotate-down;
        }
        #rotator[data-direction="up"].animate
        {                
            animation-name: label-rotate-up;
        }

        #rotator[data-direction="fade"].animate
        {                
            animation-name: label-rotate-fade;
            animation-timing-function: ease-out;
            animation-duration: var(--duration-fade);                
            --duration: var(--duration-fade);
        }
        #rotator .rotator-element:first-of-type
        {
            opacity: 1;
        }

        #rotator .rotator-element + .rotator-element
        {
            opacity: 0;
        }

        #rotator.animate .rotator-element:first-of-type
        {
            animation: label-hide var(--duration) var(--timing)  both;
        }
        #rotator.animate .rotator-element:nth-of-type(2)
        {
            animation: label-show var(--duration) var(--timing)  both;
        }

        #rotator[data-direction="none"].animate .rotator-element:first-of-type
        {
            animation: none;
        }
        #rotator[data-direction="none"].animate .rotator-element:nth-of-type(2)
        {
            animation: none;
        }

        #rotator[data-direction="fade"].animate .rotator-element:first-of-type
        {
            animation: label-show-fade var(--duration-fade) linear both;
        }
        #rotator[data-direction="fade"].animate .rotator-element:nth-of-type(2)
        {
            animation: label-hide-fade var(--duration-fade) linear both;
        }

        #rotator[data-direction="fade"] .rotator-element:first-of-type
        {
            opacity: 1;
            transition: opacity var(--duration-fade) ease-out;
        }

        #rotator[data-direction="fade"] .rotator-element + .rotator-element
        {
            opacity: 0;
            margin-bottom: calc(-1 * var(--label-height));
        }

        
        @keyframes label-rotate-down {
            0%
            {
                transform: translateY(0);
            }
            100%
            {                    
                transform: translateY(calc(1 * var(--label-height)));
            }
        }
        @keyframes label-rotate-up {
            0%
            {
                transform: translateY(0);
            }
            100%
            {                    
                transform: translateY(calc(-1 * var(--label-height)));
            }
        }
        @keyframes label-rotate-fade {
            0%
            {  
                opacity: 1;                                   
            }
            100%
            {    
                opacity: 0;                   
            }
        }
        @keyframes label-rotate-none {
            0%
            {
                transform: translateY(0);                     
            }
            100%
            {                     
                transform: translateY(calc(1 * var(--label-height)));
            }
        }
        @keyframes label-show {
            0%, 25%
            {
                opacity: 0;
            }
            100%, 60%
            {                    
                opacity: 1;
            }
        }
        @keyframes label-hide {
            0%, 25%
            {
                opacity: 1;
            }
            50%, 100%
            {                    
                opacity: 0;
            }
        }

        .rotator-element
        {
            display: flex;
            align-items: center;
            justify-content: center;
            --icon-size: 32px;
            --font-size: 28px;
            font-size: var(--font-size);
            max-width: 100%;
        }

        .rotator-icon
        {
            // width: var(--icon-size);
            // height: var(--icon-size);
            font-size: var(--font-size);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.25em;
            letter-spacing: 0.1em;
            margin-top: calc(0.1em + 0.25 * ( var(--font-size) - var(--icon-size)));
        }

        .rotator-icon:has(img[src=""])
        {
            display: none;
        }

        img[src=""]
        {
            display: none;
        }

        .rotator-icon img
        {
            width: 100%;
            height: 100%;
        }

        .rotator-text
        {
            display: block;
            line-height: 2;
            letter-spacing: 0.1em;
            flex-shrink: 1;
            flex-grow: 0;
            white-space: nowrap;
        }


        .icon-twitch
        {
            width: 30px;
            height: 30px;
        }

        .icon-youtube
        {
            width: 32px;
            height: 32px;
            margin-right: 2px;
        }

        .icon-x
        {
            width: 24px;
            height: 24px;
            margin-right: -2px;
        }

        .icon-twitter
        {
            width: 32px;
            height: 32px;
            margin-right: -2px;
        }

        .icon-tiktok
        {
            width: 30px;
            height: 30px;
            margin-right: -2px;
        }

        .icon-facebook
        {
            width: 28px;
            height: 28px;
        }

        .icon-instagram
        {
            width: 28px;
            height: 28px;
        }

    </style>

        let prevHour = -1;

        let dateM, dateML, dateMonth, dateD, dateDL, dateDJp, dateDate;

        const DEFAULT_FONT = '"Nunito", "Noto Sans JP", "Noto Sans SC", sans-serif';

        function applySettings()
        {
            resetTime();

            let container = document.getElementById("main-container");

            
            if(prevClockTimestamp != settings.timestamp)
            {
                prevClockTimestamp = settings.timestamp
                    
                container.style.setProperty("--background-color", settings.colorBg);
                container.style.setProperty("--text-color", settings.colorText);
                container.style.setProperty("--accent-color", settings.colorAccent);

                container.style.setProperty("--border-radius", settings.borderRadius+"px");
                container.style.setProperty("--clock-adjust", settings.clockAdjust+"px");
                
                let alignV = "center";
                if(settings.borderAlign.includes("top"))
                {
                    alignV = "top";
                }
                else if(settings.borderAlign.includes("bottom"))
                {
                    alignV = "bottom"
                }

                let alignH = "center";
                if(settings.borderAlign.includes("left"))
                {
                    alignH = "left";
                }
                else if(settings.borderAlign.includes("right"))
                {
                    alignH = "right"
                }

                container.dataset.alignvertical = alignV;
                container.dataset.alignhorizontal = alignH;

                let newFont = DEFAULT_FONT;
                if(settings.font)
                {
                    newFont = '"'+settings.font+'", '+DEFAULT_FONT;
                }

                container.style.setProperty("--font-family", newFont);

                container.style.setProperty("--font-weight", settings.fontWeight);

                document.getElementById("clock-icon").style.display = (settings.analogDisplay?"block":"none");
                document.getElementById("analog-clock-second").style.display = (settings.secondHand == "none"?"none":"block");
                document.getElementById("analog-clock-center").style.display = (settings.secondHand == "none"?"none":"block");
                useMs = settings.secondHand == "smooth";
                document.getElementById("clock-text-separator").innerHTML = settings.separator;
                document.getElementById("clock").dataset.separator = settings.separatorAnimation;
                document.getElementById("clock").dataset.hoursystem = settings.hourMode;
            
            }

            if(prevTimestamp == labelSettings.timestamp) return;

            if(!labelSettings.dateDisplay && labelSettings.labels.length == 0)
            {
                document.getElementById("rotator-container").style.display = "none";
            }
            else 
            {
                document.getElementById("rotator-container").style.display = "block";
            }

            prevTimestamp = labelSettings.timestamp;
            
            document.getElementById("rotator").classList.remove("animate");  
            clearLabels()

            newFont = DEFAULT_FONT;
            if(labelSettings.font)
            {
                newFont = '"'+labelSettings.font+'", '+DEFAULT_FONT;
            }
            container.style.setProperty("--font-family-label", newFont);
            container.style.setProperty("--font-weight-label", labelSettings.fontWeight);
            document.getElementById("rotator").dataset.direction = labelSettings.animation;

            if(labelSettings.animation == "fade")
            {
                labelRotationDelay = labelRotationDelayFade;
            }
            else if(labelSettings.animation == "none")
            {
                labelRotationDelay = labelRotationDelayNone;
            }
            else
            {
                labelRotationDelay = labelRotationDelayDefault;
            }
            
            if(labelSettings.dateDisplay)
            {
                createDateElement(labelSettings.dateFormat, labelSettings.dateDuration);
            }

            labelSettings.labels.forEach(label => {
                if(!label) return;
                createLabelElement(label.icon, label.text, label.duration);
            });

            let duration = parseInt(labelSettings.dateDuration);
            if(!duration)
            {
                duration = labelRotationDelayDefault;
            }
            else
            {
                duration = duration * 1000;
            }

            if(labelTimeout)
            {
                clearTimeout(labelTimeout);
            }
            labelTimeout = setTimeout(updateLabel, duration);

        }

        function resetTime()
        {
            prevSecond = -1;
            prevMinute = -1;
            prevHour = -1;
            prevDate = -1;
            prevAmpm = "--";

            hourMode = (settings.hourMode?settings.hourMode:24);

        }

        function clearLabels()
        {
            document.getElementById("rotator").innerHTML = "";
        }

        function createDateElement(dateFormat, dateDuration)
        {
            let text = dateFormat;

            text = text.replaceAll("[m]","<span id='date-m'></span>");
            text = text.replaceAll("[M]","<span id='date-M'></span>");
            text = text.replaceAll("[month]","<span id='date-month'></span>");
            text = text.replaceAll("[djp]","<span id='date-djp'></span>");
            text = text.replaceAll("[d]","<span id='date-d'></span>");
            text = text.replaceAll("[D]","<span id='date-D'></span>");
            text = text.replaceAll("[date]","<span id='date-date'></span>");         
                                    
            text = text.replaceAll("[","<span class='accent'>");
            text = text.replaceAll("]","</span>");
            
            let elem = '<div id="date-label" class="rotator-element" data-duration="'+(parseFloat(dateDuration) * 1000)+'"><div class="rotator-text">'+text+'</div></div>';
            

            document.getElementById("rotator").insertAdjacentHTML('beforeend', elem);

            prevDate = -1;
            dateM = document.getElementById("date-m")
            dateMonth = document.getElementById("date-month")
            dateML = document.getElementById("date-M")
            dateD = document.getElementById("date-d")
            dateDL = document.getElementById("date-D")
            dateDJp = document.getElementById("date-djp")
            dateDate = document.getElementById("date-date")

            
            let currDate = new Date();
            if(dateM) dateM.innerHTML = MONTH_NAMES_SHORT[currDate.getMonth()];
            if(dateMonth) dateMonth.innerHTML = (currDate.getMonth() + 1);
            if(dateML) dateML.innerHTML = MONTH_NAMES[currDate.getMonth()];
            if(dateD) dateD.innerHTML = DAY_NAMES_SHORT[currDate.getDay()];
            if(dateDL) dateDL.innerHTML = DAY_NAMES[currDate.getDay()];
            if(dateDJp) dateDJp.innerHTML = DAY_NAMES_JP[currDate.getDay()];
            if(dateDate) dateDate.innerHTML = currDate.getDate();
            
        }

        function createLabelElement(icon, text, duration)
        {
            if(!text)return;

            let svg = ICON_MAP.get(icon);
            if(svg)
            {
                icon = '<div class="rotator-icon">'+svg+'</div>';
            }
            else
            {
                icon = '';
            }


            text = text.replaceAll("[","<span class='accent'>");
            text = text.replaceAll("]","</span>");

            let elem = '<div class="rotator-element" data-duration="'+(parseFloat(duration) * 1000)+'">'+icon+'<div class="rotator-text">'+text+'</div></div>';

            document.getElementById("rotator").insertAdjacentHTML('beforeend', elem);
        }

        function updateTime()
        {
            let currDate = new Date();
            
            let hour = currDate.getHours();
            let minute = currDate.getMinutes();
            let second = currDate.getSeconds();
            let ms = currDate.getMilliseconds();
            let d = currDate.getDate();
            let ampm = "";                
            ampm = (hour>=12?"PM":"AM");

            if(settings.analogDisplay)
            {
                let hourDeg = ((hour % 12) + (minute)/60) * 30;
                let minuteDeg = (minute + (second)/60) * 6;
                let secondDeg = (second + (useMs?ms/1000:0)) * 6;
                
                document.getElementById("analog-clock-second").style.transform = "rotate("+secondDeg+"deg)";
                document.getElementById("analog-clock-minute").style.transform = "rotate("+minuteDeg+"deg)";
                document.getElementById("analog-clock-hour").style.transform = "rotate("+hourDeg+"deg)";
            }

            if(prevSecond==second) return
            
            prevSecond = second;

            if(prevMinute==minute) return

            prevMinute = minute;
            document.getElementById("clock-text-minute").innerHTML = toTwoDigit(minute);

            if(prevHour==toHour(hour)) return
            
            prevHour = toHour(hour);
            document.getElementById("clock-text-hour").innerHTML = toTwoDigit(toHour(hour));

            if(prevAmpm == ampm) return
            
            prevAmpm = ampm;
            document.getElementById("clock-text-ampm").innerHTML = ampm;
            
            if(prevDate == d) return
            
            prevDate = d;
            if(dateM) dateM.innerHTML = MONTH_NAMES_SHORT[currDate.getMonth()];
            if(dateMonth) dateMonth.innerHTML = (currDate.getMonth() + 1);
            if(dateML) dateML.innerHTML = MONTH_NAMES[currDate.getMonth()];
            if(dateD) dateD.innerHTML = DAY_NAMES_SHORT[currDate.getDay()];
            if(dateDL) dateDL.innerHTML = DAY_NAMES[currDate.getDay()];
            if(dateDJp) dateDJp.innerHTML = DAY_NAMES_JP[currDate.getDay()];
            if(dateDate) dateDate.innerHTML = currDate.getDate();
            
        }

        function toHour(num)
        {
            if(hourMode==24) return num;
            let h = (num%12);
            if(h==0) return 12;
            else return h;
        }

        function toTwoDigit(num)
        {
            if(num>=10)
            {
                return ""+num;
            }
            else return "0"+num;
        }

        
        let clockInterval;
        
        function init()
        {
            updateTime();

            //adjust breathing to seconds
            let currDate = new Date();          
            let ms = currDate.getMilliseconds();
            let difference = 1000-(ms%1000);

            document.getElementById("clock-text-separator").style.animation = 'none';
            document.getElementById("clock-text-separator").offsetHeight;
            document.getElementById("clock-text-separator").style.animation = null;
            document.getElementById("clock-text").style.setProperty("--seconds-delay", "-"+ms+"ms");
            
            clearInterval(clockInterval);
            setTimeout(() => {
                clockInterval = setInterval(() => {
                    updateTime();
                }, 100);
            }, difference);


            document.getElementById("clock").dataset.hoursystem = hourMode;

            let maxWidth = document.getElementById("clock").offsetWidth;
            document.getElementById("rotator-container").style.setProperty("--max-width",maxWidth+"px");
            
            //initial label rotation                
            let parent = document.getElementById("rotator");
            if(parent.children.length<=1) return;
            let elem = parent.children[0];
            
            let duration = parseInt(elem.dataset.duration);
            if(isNaN(duration))
            {
                duration = labelRotationDuration;
            }

            duration = Math.max(duration, labelRotationDelayMinimum);

            labelTimeout = setTimeout(updateLabel, duration);
        }

        function updateLabelManual()
        {
            if(isTransitioning)return;

            isTransitioning = true;
            if(labelTimeout)
            {
                clearTimeout(labelTimeout);
            }
            labelTimeout = setTimeout(updateLabel, 10);
        }

        async function updateLabel()
        {
            let parent = document.getElementById("rotator");
            if(parent.children.length<=1) return;

            let elem = parent.children[0];

            parent.classList.add("animate");
            
            clearTimeout(labelTimeout);
            isTransitioning = true;
            await delay(labelRotationDelay);
            isTransitioning = false;
            parent.classList.remove("animate");                
            parent.append(elem);

            let nextChild = parent.children[0];
            let duration = parseInt(nextChild.dataset.duration);
            if(isNaN(duration))
            {
                duration = labelRotationDuration;
            }

            duration = Math.max(duration, labelRotationDelayMinimum);

            labelTimeout = setTimeout(updateLabel, duration);
        }

        function delay(ms)
        {
            return new Promise(resolve=>setTimeout(resolve, ms));
        }
        
    </script>
